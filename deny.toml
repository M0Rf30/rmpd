# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # generational-arena is used by tantivy, no maintained alternatives available
    "RUSTSEC-2024-0014",
    # paste is a proc-macro that is feature-complete and stable
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Allow only these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # aws-lc-sys uses OpenSSL license
    { allow = ["ISC", "Apache-2.0", "OpenSSL"], name = "aws-lc-sys" },
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Deny old versions of important crates
    { name = "openssl", version = "<0.10" },
    { name = "rustls", version = "<0.21" },
]

skip = [
    # Skip duplicate version warnings for these crates
    # (they may have multiple versions in the dep tree)
    #
    # base64 0.22 is pinned internally by hyper-util (part of reqwest's
    # HTTP stack) and by tantivy; both are third-party crates whose
    # Cargo.toml we don't control from this workspace. Our own dependents
    # (reqwest itself, rmpd-library) already pull the current major via
    # `base64 = "0.23"` in [workspace.dependencies] — nothing to bump here.
    { name = "base64", version = "0.22" },
    # rand 0.9 is pinned internally by opensubsonic-rs (a separate git repo,
    # only pulled in when the `subsonic` feature is enabled). We don't
    # control that repo's Cargo.toml from here. Our own crates use
    # `rand = "0.10"` (rmpd-core, via [workspace.dependencies]). Do not
    # force-patch a transitive dependency to work around this.
    { name = "rand", version = "0.9" },
    #
    # NOTE: thiserror 1.0.69 also appears in Cargo.lock (pulled by ndk, an
    # Android-only dependency of the RustAudio/cpal fork we pin) alongside
    # our thiserror = "2". It is not listed here because it never resolves
    # for any target in `[graph] targets` above (none of them is Android),
    # so cargo-deny's bans check never sees it as a duplicate in practice.
]

skip-tree = [
    # Skip checking these crates and their dependencies
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Allow these git sources (from workspace dependencies)
    "https://github.com/M0Rf30/Symphonia",
    "https://github.com/RustAudio/cpal",
]

[sources.allow-org]
github = ["M0Rf30", "RustAudio"]
