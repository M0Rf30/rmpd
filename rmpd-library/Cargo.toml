[package]
name = "rmpd-library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# thiserror used for error handling macros
# base64 used in fingerprint module for encoding
# chromaprint-next is imported as `chromaprint` (its [lib] name)
ignored = ["thiserror", "base64", "chromaprint-next"]

[features]
# Chromaprint audio fingerprinting (`getfingerprint`) via chromaprint-next, a
# pure-Rust port producing output bit-identical to libchromaprint. Default-on;
# opt out with `cargo build --no-default-features` to drop it.
default = ["fingerprint"]
fingerprint = ["dep:chromaprint-next"]

[dependencies]
rmpd-core = { workspace = true, features = ["database-errors", "library-errors"] }
rmpd-player.workspace = true
rusqlite = { workspace = true, features = ["functions"] }
symphonia.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
camino.workspace = true
sha2.workspace = true
chromaprint-next = { workspace = true, optional = true }
base64.workspace = true
rayon.workspace = true
icu_collator = "2.3.1"
regex = "1"


[dev-dependencies]
rmpd-core = { workspace = true, features = ["test-utils"] }
tempfile = "3"
rusqlite.workspace = true
