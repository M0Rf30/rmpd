# rmpd configuration file
#
# Every section and key is optional; anything omitted falls back to a built-in
# default. Paths starting with "~" are expanded to your home directory.
#
# rmpd searches for this file, in order, at:
#   $XDG_CONFIG_HOME/rmpd/rmpd.toml   (usually ~/.config/rmpd/rmpd.toml)
#   ~/.rmpd.toml
#   ~/.rmpd/rmpd.toml
#   /etc/rmpd/rmpd.toml
# The first one found wins. This file is also the shipped starter config: every
# uncommented value below matches rmpd's built-in default, except
# music_directory (set here to a sample path since it has no safe default).

[general]
# Path to your music library. Defaults to $XDG_MUSIC_DIR, else ~/Music.
music_directory = "~/Music"
# The following default to your XDG config dir (~/.config/rmpd/…) when omitted:
# playlist_directory = "~/.config/rmpd/playlists"
# db_file = "~/.config/rmpd/database.db"
# The state file defaults to $XDG_STATE_HOME/rmpd/state (~/.local/state/rmpd/state;
# $STATE_DIRECTORY/state under systemd StateDirectory=). An existing
# ~/.config/rmpd/state from older releases keeps being used until the new file exists.
# state_file = "$XDG_STATE_HOME/rmpd/state"
# Path values accept "~/" and, like mpd.conf, $HOME, $XDG_CONFIG_HOME,
# $XDG_MUSIC_DIR, $XDG_CACHE_HOME, $XDG_DATA_HOME, $XDG_RUNTIME_DIR and
# $XDG_STATE_HOME prefixes (e.g. "$XDG_CACHE_HOME/rmpd/database.db").
log_level = "info"
# Follow symlinks that resolve inside/outside music_directory, independently.
# Matches mpd.conf's follow_inside_symlinks/follow_outside_symlinks.
follow_inside_symlinks = true
follow_outside_symlinks = true
filesystem_charset = "UTF-8"
# Auto-save the state file this many seconds after each state change.
# 0 disables periodic saving (the state file is still written on a clean
# shutdown). Matches mpd.conf's state_file_interval.
state_file_interval = 120
# Write logs to this file instead of stdout. Matches mpd.conf's log_file.
# log_file = "~/.config/rmpd/rmpd.log"
# When logging to a file, SIGHUP closes and re-opens it (for logrotate).
# Maximum number of songs allowed in the queue. Matches mpd.conf's max_playlist_length.
max_playlist_length = 16384
# Number of recently played songs remembered (exposed by the HTTP API's
# core.history.get_history, saved in the state file). 0 disables the history.
history_length = 1000
# Store absolute paths (instead of paths relative to music_directory) when
# saving .m3u playlists. Matches mpd.conf's save_absolute_paths_in_playlists.
save_absolute_paths_in_playlists = false
# Restrict which tag types are read/stored during library scans, e.g.
# ["artist", "album", "title"]. Unset = keep every supported tag. Matches
# mpd.conf's metadata_to_use.
# metadata_to_use = ["artist", "album", "title", "track", "genre", "date"]

[network]
# Address to listen on for TCP clients. As with MPD's `bind_to_address`, this
# accepts either an address or a path: a path (absolute, or starting with ~)
# names a UNIX socket and binds no TCP listener at all.
bind_address = "127.0.0.1"
port = 6600
# Optional extra listener: a UNIX domain socket for local clients
#   mpc -h /run/user/1000/rmpd.sock status
# It is served in addition to the address above. For a socket-only daemon,
# name the path in bind_address instead, or empty the address and keep this.
# unix_socket = "/run/user/1000/rmpd.sock"
max_connections = 100
connection_timeout = 60
# Desktop media integration: on Linux the session D-Bus MPRIS interface
# (org.mpris.MediaPlayer2.rmpd) lets desktop environments, playerctl and media
# keys detect and control rmpd. On macOS the same switch enables Now Playing and
# the headphone remote commands.
media_controls = true
# Advertise rmpd on the LAN via mDNS/Zeroconf (_mpd._tcp) so clients can
# auto-discover it. Disable if you don't want the daemon's presence and
# hostname broadcast on the network (e.g. bind_address = "127.0.0.1").
zeroconf_enabled = true
# The two switches above (and zeroconf_name) are implemented by the built-in
# `mpris` and `mdns` integrations. To configure them explicitly instead, add
# (an explicit block replaces the implicit one; `mdns` then needs a fixed port):
# [[integration]]
# name = "desktop"
# type = "mpris"
#
# [[integration]]
# name = "zeroconf"
# type = "mdns"
# port = 6600
# zeroconf_name = "rmpd@%h"
#
# Scrobblers and notifiers (opt-in Cargo features: `listenbrainz`, `lastfm`,
# `webhook`; e.g. `cargo build --release --features listenbrainz,lastfm`).
# Completed listens (played >= min(duration/2, 4 min), track >= 30 s, pauses
# and seeks excluded) are queued in the state directory while offline.
# `scrobble_streams = true` also scrobbles radio streams (ICY "Artist - Title").
# `max_queue` caps the offline queue (default 10000).
# [[integration]]
# name = "listenbrainz"
# type = "listenbrainz"
# token = "<user token from https://listenbrainz.org/settings/>"
# api_url = "https://api.listenbrainz.org"   # default
# scrobble_streams = false
#
# Last.fm / libre.fm. Get api_key + api_secret at
# https://www.last.fm/api/account/create, then a permanent session_key via the
# web auth flow (auth.getToken -> https://www.last.fm/api/auth/?api_key=KEY&token=TOKEN
# -> auth.getSession signed with md5; see the README "Scrobbling" section).
# [[integration]]
# name = "lastfm"
# type = "lastfm"
# api_key = "..."
# api_secret = "..."
# session_key = "..."
# api_url = "https://ws.audioscrobbler.com/2.0/"   # libre.fm: "https://libre.fm/2.0/"
#
# POST every event as JSON {"event", "timestamp", "payload"}. `events` defaults
# to all except position_changed / bitrate_changed / database_update_progress
# (use ["*"] for literally everything). `secret` adds an
# `X-Rmpd-Signature: sha256=<hex HMAC-SHA256 of the body>` header.
# [[integration]]
# name = "hook"
# type = "webhook"
# url = "https://example.org/rmpd-hook"
# events = ["song_changed", "player_state_changed"]
# secret = "shared secret"
# signature_header = "X-Rmpd-Signature"
# headers = { Authorization = "Bearer abc" }
#
# HTTP JSON-RPC (Mopidy-compatible `core.*` subset) + WebSocket events + an
# optional static web client (opt-in Cargo feature `http-api`).
# POST /rmpd/rpc (alias /mopidy/rpc), WebSocket /rmpd/ws (alias /mopidy/ws).
# `token` guards the RPC/WebSocket endpoints (`Authorization: Bearer <token>`,
# or `?token=` on the WebSocket URL). Browsers sending an `Origin` header are
# refused unless it is listed in `allowed_origins` ("*" = any) or is the
# server's own localhost/IP origin. Binding beyond loopback without a token
# logs a warning.
# [[integration]]
# name = "web"
# type = "http"
# bind = "127.0.0.1:6680"                      # default
# allowed_origins = ["http://localhost:3000"]
# static_dir = "/usr/share/rmpd/web"           # served at /
# token = "secret"
# Restrict access with passwords, each granting its own permission set
# (one of "read", "add", "control", "admin", "player"). Matches mpd.conf's
# repeatable `password "pw@perms"` directive.
# [[network.passwords]]
# password = "secret"
# permissions = ["read", "add", "control"]
# Permissions granted to a client that hasn't authenticated. Unset = every
# permission when no password is configured at all (matches MPD).
# default_permissions = ["read"]
# Permissions granted to clients connecting over the Unix domain socket.
# Unset = falls back to default_permissions.
# local_permissions = ["read", "add", "control", "admin"]
# Permissions granted to clients by source address, optionally with a CIDR
# mask. Matches mpd.conf's repeatable `host_permissions "host perms"`.
# [[network.host_permissions]]
# host = "192.168.1.0/24"
# permissions = ["read", "control"]
# Maximum size, in bytes, of a single MPD command list. Matches mpd.conf's
# max_command_list_size (specified there in KiB).
max_command_list_size = 16777216
# Maximum size, in bytes, of the outgoing response buffer to a client.
# Matches mpd.conf's max_output_buffer_size (specified there in KiB).
max_output_buffer_size = 8388608
# Service name advertised via mDNS/Zeroconf; %h is replaced with the
# machine hostname. Matches mpd.conf's zeroconf_name.
zeroconf_name = "rmpd@%h"

[audio]
default_output = "default"
# Pause playback when the default output device disappears mid-track (macOS
# only), e.g. a Bluetooth headset switching off. Set to false to keep playing.
pause_on_device_loss = true
buffer_time = 500
# Sample-rate conversion quality, used whenever the output device cannot play a
# stream's native rate — including DSD-to-PCM conversion, which decodes DSD to a
# 44.1 kHz-family rate and then resamples here to the device's native rate
# (rather than letting a sound server like PipeWire resample, which can underrun
# and leave DSD ultrasonic noise in-band). One of: sinc_best, sinc_medium, sinc_fast, linear.
resampler_quality = "sinc_medium"
# DSD over PCM (DoP) for DSD files. "no" = always convert to PCM (default,
# works on any DAC); "yes" = always send native DSD via DoP (needs a DoP DAC on
# a bit-perfect path — set `device` below); "auto" = DoP only when `device` is
# set. The RMPD_DOP env var overrides this.
dop = "no"
# Output device id (ALSA PCM name). Empty/unset = system default (PipeWire),
# whose graph rate (often 48 kHz) is used for PCM and DSD-to-PCM — rmpd does NOT
# auto-open your DAC at its native rate in that case. Set a raw `hw:` device for
# bit-perfect DoP and for native-rate DSD-to-PCM (e.g. 88.2 kHz), bypassing
# PipeWire's resampling: when the configured device natively supports the
# decoded rate, rmpd opens it directly with no resampling.
# Discover ids with: cargo run -p rmpd-player --example list_devices
# (or set RMPD_LIST_DEVICES=1). The RMPD_AUDIO_DEVICE env var overrides this.
# device = "hw:CARD=1,DEV=0"
replay_gain = "off"
replay_gain_preamp = 0.0
replay_gain_missing_preamp = 0.0
volume_normalization = false
crossfade = 0
mixramp_db = 0.0
mixramp_delay = 0.0
# Global DSP filter chain: names of [[filter]] blocks applied, in order, to every
# output that has no `filters` of its own. Default: none (audio untouched).
# filters = ["eq", "agc"]

# DSP filters (MPD-style filter plugins; pure Rust, no extra dependencies).
# Each block is a named instance of a filter `type`; outputs select the chain
# with `filters = ["name", ...]` ([audio].filters is the global default; an
# empty `filters = []` on an output disables filtering for it). Filters keep
# the channel count and run on the decoded stream before the software volume.
#
# # type = "equalizer": N-band parametric EQ (peaking biquads, coefficients are
# # recomputed per sample rate). bands: freq (Hz), gain_db (+/-48), q (default
# # 1.0). preamp_db (default 0) lowers/raises the level before the bands; use a
# # negative preamp when boosting to avoid clipping.
# [[filter]]
# name = "eq"
# type = "equalizer"
# preamp_db = -3.0
# bands = [
#   { freq = 60,   gain_db = 4.0, q = 0.7 },
#   { freq = 1000, gain_db = -2.0 },
#   { freq = 8000, gain_db = 3.0, q = 1.2 },
# ]
#
# # type = "normalize": AGC / volume normalization (MPD's `normalize` filter).
# # Steers the recent peak level to `target_db` (dBFS) with at most
# # `max_gain_db` of amplification; `attack_ms` is how fast the gain falls on
# # loud passages, `release_ms` how fast it rises on quiet ones, `window_ms` the
# # peak-hold window, `ceiling_db` the hard limiter ceiling. Defaults shown.
# [[filter]]
# name = "agc"
# type = "normalize"
# target_db = -3.0
# max_gain_db = 30.0
# attack_ms = 10.0
# release_ms = 1500.0
# window_ms = 400.0
# ceiling_db = -0.3
#
# # type = "route" (alias "channels"): channel routing that keeps the channel
# # count. mode = "mono" (average all channels into every channel, i.e. stereo
# # -> mono downmix; default) | "swap" (stereo L<->R) | "left" | "right" (copy
# # that channel to all) | "map" with map = [source channel for each output
# # channel], e.g. [1, 0] swaps. A mode that does not fit the stream's channel
# # count passes audio through unchanged.
# [[filter]]
# name = "mono"
# type = "route"
# mode = "mono"
#
# # Per-output chain, overriding [audio].filters:
# # [[output]]
# # name = "Headphones"
# # type = "default"
# # filters = ["eq", "agc"]

[[output]]
name = "Default Output"
type = "default"
enabled = true
# MPD-style per-output settings are also honored (used when [audio].dop/device
# are unset), e.g. a dedicated DAC for bit-perfect DoP:
# [[output]]
# name = "Fosi DS2"
# type = "alsa"
# enabled = true
# device = "hw:CARD=1,DEV=0"
# dop = "yes"
#
# # Native PipeWire client output: opens the stream at the decoded rate and lets
# # PipeWire follow/own the graph rate (no rmpd-side downsample, no double
# # resample). Build with `cargo build --features pipewire`. Falls back to the
# # cpal path automatically if the feature isn't compiled in.
# [[output]]
# name = "PipeWire"
# type = "pipewire"
# enabled = true
#
# # Per-output volume control (MPD's mixer_type). Default = "software" (rmpd's
# # own gain stage). "hardware" drives the device's own mixer (ALSA simple
# # mixer; Linux, cpal/alsa outputs, build with `--features alsa-mixer`) and
# # keeps the software gain at 100%. "none" (alias "null") disables volume:
# # `setvol` returns an error and `status` omits `volume`.
# [[output]]
# name = "DAC"
# type = "alsa"
# enabled = true
# device = "hw:CARD=1,DEV=0"
# mixer_type = "hardware"        # software | hardware | none
# mixer_device = "hw:1"          # default: card of `device`, else "default"
# mixer_control = "PCM"          # default: tries "PCM", then "Master"
# mixer_index = 0                # default 0
#
# # Network/file outputs with pluggable encoders. `encoder` is one of
# # "wav" (default), "pcm", "flac" (pure Rust) or "opus" (pure Rust Ogg Opus,
# # recommended for Icecast bandwidth). `compression` (0-8, default 5) tunes
# # flac; for opus `bitrate` (kbps, default 128), `complexity` (0-10, default 9;
# # `quality` is accepted as an alias) and `vbr` ("vbr" default, "cvbr", "cbr")
# # apply. Opus is always coded at 48 kHz (other rates are resampled).
# [[output]]
# name = "HTTP stream"
# type = "httpd"
# port = 8000
# encoder = "flac"
# compression = 5
#
# [[output]]
# name = "Recording"
# type = "recorder"
# path = "/tmp/rmpd-recording.flac"
# encoder = "flac"               # omit for the default WAV writer; "opus" -> .opus file
#
# # Icecast2 source client (plain HTTP PUT; no TLS). Streams the encoded audio
# # to <host>:<port><mount> and sends /admin/metadata on song change.
# [[output]]
# name = "Icecast"
# type = "shout"
# host = "localhost"
# port = 8000
# mount = "/rmpd"
# user = "source"                # default "source"
# password = "hackme"            # required; never logged
# encoder = "flac"               # default "flac"; "opus" saves bandwidth (audio/ogg)
# # bitrate = 96                 # opus only: kbps (default 128)
# genre = "Various"
# description = "rmpd stream"
# public = false

[database]
auto_update = true
filesystem_watch = true
# Maximum directory depth watched below music_directory by the filesystem
# watcher. Unset = unlimited. Matches mpd.conf's auto_update_depth.
# auto_update_depth = 4
# Hide a song from directory listings/find/search when it is the physical
# file underlying embedded-cue virtual tracks (see [playlist] below) -- it
# stays directly addressable/playable by its exact path. Matches mpd.conf's
# hide_playlist_targets.
hide_playlist_targets = true

[playlist]
# Show a FLAC's embedded CUESHEET (text comment or binary block) as a
# browsable virtual directory of per-track songs during library scans.
# Mirrors mpd.conf's playlist_plugin "embcue"/"flac" { as_directory }, whose
# MPD default is "no" (stock MPD never scans an embedded cue sheet into its
# database); rmpd defaults this to true instead as an intentional deviation.
# Set to false for MPD parity: load/listplaylist(info) on the file still
# expand it into range-restricted tracks either way.
embedded_cue_as_directory = true

[stream]
# HTTP(S) radio input. Playlist URLs (.pls, .m3u, .m3u8, .asx, .xspf, or a
# matching Content-Type) are fetched and unwrapped automatically. HLS
# (adaptive) playlists are played natively: audio-only variants are preferred,
# and ADTS-AAC, MP3, fMP4 and MPEG-TS segments (AES-128 encryption included)
# are supported; SAMPLE-AES is not.
# Connect and per-read timeout in milliseconds.
timeout_ms = 5000
# fnmatch-style globs (*, ?, [abc]) of stream URLs whose in-band ICY
# StreamTitle must be ignored (stations that send ads or junk as titles).
# metadata_blacklist = ["*://ads.example.com/*", "http://*.noisy-radio.net/*"]
# HLS only: bandwidth ceiling in bits per second (the playlist BANDWIDTH
# unit). The best variant not above it is played, or the lowest variant when
# all exceed it. Unset: the best audio-only variant (lowest when the playlist
# only has video variants, whose video is discarded).
# hls_max_bandwidth = 128000
#
# Route all stream and playlist requests through an HTTP proxy.
# [stream.proxy]
# url = "http://proxy.example.com:3128"
# username = "alice"      # optional
# password = "s3cr3t"     # optional

# ── Music Sources ────────────────────────────────────────────────────────────
# Remote catalogs are declared as [[source]] blocks. Each enabled source is
# synced into rmpd's SQLite index under a mount-style virtual path of the form
# <name>/<Artist>/<Album>/<remote-id>.<ext> (browsable like a local folder).
#
# Example: OpenSubsonic-compatible server (Navidrome, Jellyfin, Airsonic …)
# Uncomment and fill in your server details to activate.
#
# [[source]]
# name = "home"           # label; becomes the top-level mount directory in paths
# type = "subsonic"       # backend type; "subsonic" requires the subsonic feature
# enabled = false         # set to true to activate
# url = "https://music.example.com"
# username = "alice"
# password = "s3cr3t"
# # Optional: cap streaming bitrate (kbps). 0 or absent = server default.
# # max_bitrate = 320
# # Optional: preferred transcoding format ("raw" = original, "mp3", "opus", …).
# # format = "raw"
#
# Example: Jellyfin server (requires the `jellyfin` feature). Catalog is synced
# like Subsonic; streams use /Audio/<id>/stream (or /universal when
# `max_bitrate` / `format` ask for transcoding).
#
# [[source]]
# name = "jelly"
# type = "jellyfin"
# url = "https://jellyfin.example.com"
# username = "alice"
# password = "s3cr3t"     # or: api_key = "..." (then also set user_id)
# # user_id = "<32-hex user id>"   # optional with username/password
# # max_bitrate = 320     # kbps; enables /universal transcoding
# # format = "mp3"        # transcode target (mp3, opus, aac, ...)
# # accept_invalid_certs = false
#
# Example: podcasts (requires the `podcast` feature). On-demand: nothing is
# synced; `lsinfo podcasts` lists one directory per feed, newest episode first.
# `feeds` takes feed URLs and/or OPML documents (path or URL ending in .opml).
#
# [[source]]
# name = "podcasts"
# type = "podcast"
# feeds = ["https://example.com/feed.xml", "~/subscriptions.opml"]
# # max_episodes = 50     # episodes listed per podcast
# # cache_ttl = 900       # seconds feeds are cached
#
# Example: internet radio via Radio-Browser (requires the `radio` feature).
# On-demand tree: favourites, top-voted, top-clicked, countries/<c>, tags/<t>.
# The API server is discovered via all.api.radio-browser.info unless pinned.
#
# [[source]]
# name = "radio"
# type = "radio"
# # api_url = "https://de1.api.radio-browser.info"
# # stations = ["<stationuuid>", "<stationuuid>"]   # shown under `favourites`
# # limit = 100           # stations per listing (1..1000)
# # hide_broken = true
#
# [[source]]              # SomaFM channels (also part of the `radio` feature)
# name = "somafm"
# type = "somafm"
# # format = "mp3"        # mp3, aac or aacp

# ── Cover-art providers ─────────────────────────────────────────────────────
# `albumart` / `readpicture` first use a cover.* file next to the song and the
# embedded picture; only when neither exists are the [[artwork]] providers
# asked, in config order (first hit wins). Results are cached per album in the
# database: hits forever, "no art found" for 7 days, transient failures
# (network down, rate limited) for 10 minutes. Disabled by default; the
# `coverartarchive` provider needs the `coverart` Cargo feature.
#
# Cover Art Archive: uses the MUSICBRAINZ_ALBUMID tag (then
# MUSICBRAINZ_RELEASEGROUPID) -> https://coverartarchive.org/release/<mbid>/front-500.
# With `lookup = true`, songs without an album MBID are matched by a MusicBrainz
# search on album artist + album (rate-limited to 1 request/second).
#
# [[artwork]]
# name = "caa"
# type = "coverartarchive"
# # enabled = true
# # lookup = false          # MusicBrainz search when MUSICBRAINZ_ALBUMID is missing
# # size = "500"            # 250, 500, 1200 or "original"
# # contact = "you@example.org"   # added to the User-Agent (MusicBrainz asks for one)
# # caa_url = "https://coverartarchive.org"   # mirror override
# # mb_url = "https://musicbrainz.org"        # mirror override
