[package]
name = "rmpd-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# bytes used for protocol handling
# thiserror used for error handling macros
ignored = ["bytes", "thiserror"]

[features]
# Forwards to rmpd-library's `fingerprint` feature (see that crate's
# Cargo.toml) so `getfingerprint` can be compiled out along with its
# chromaprint dependency. Default-on to match rmpd-library's default.
default = ["fingerprint"]
fingerprint = ["rmpd-library/fingerprint"]

[dependencies]
rmpd-core = { workspace = true, features = ["protocol-errors"] }
rmpd-macros.workspace = true
camino.workspace = true
rmpd-library.workspace = true
rmpd-player.workspace = true
rmpd-source.workspace = true
rmpd-plugin.workspace = true
async-trait.workspace = true
tokio.workspace = true
winnow.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
regex = "1"
mdns-sd.workspace = true

# Native macOS Now Playing / remote commands (souvlaki wraps
# MPNowPlayingInfoCenter + MPRemoteCommandCenter; the objc2 crates drive the
# AppKit main-thread run loop). Must run on the main thread, so it stays here
# rather than in rmpd-integrations. MPRIS (Linux) lives in rmpd-integrations.
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSTimer"] }
block2 = "0.6"

[dev-dependencies]
rmpd-core = { workspace = true, features = ["test-utils"] }
tempfile = "3"
tokio = { workspace = true }
async-trait.workspace = true
