# cargo-audit configuration
# See: https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
ignore = [
    # generational-arena is used by tantivy, no maintained alternatives available
    "RUSTSEC-2024-0014",
    # paste is a proc-macro that is feature-complete and stable
    "RUSTSEC-2024-0436",
    # lru unsoundness - used by tantivy, tracking upstream fix
    "RUSTSEC-2026-0002",
    # lru pop() panic-safety unsoundness (fixed in lru 0.18.2) - tantivy 0.26.1
    # pins lru ^0.16.3, so it cannot be upgraded from here; unreachable without
    # catch_unwind around a key type whose Drop panics.
    "RUSTSEC-2026-0253",
]
